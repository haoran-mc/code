<html>
	<body>
		<h2>无序列表</h2>
		<p>无序列表是一个项目的列表，此列项目使用粗体圆点（典型的小黑圆圈）进行标记</p>
		<ul>
			<li>Coffee</li>
			<li>Mike</li>
		</ul>
		<p>列表项内部可以使用段落、换行符、图片、链接以及其他列表等等</p>

		<h2>有序列表</h2>
		<p>同样，有序列表也是一列项目，列表项目使用数字进行标记</p>
		<ol>
			<li>Coffee</li>
			<li>Mike</li>
		</ol>

		<h2>定义列表</h2>
		<p>自定义列表不仅仅是一列项目，而是项目及其注释的组合</p>
		<p>自定义列表以dl标签开始，每个自定义列表项以dt开始，每个自定义列表项的定义以dd开始</p>
		<dl>
			<dt>Coffee</dt>
			<dd>Black hot drink</dd>
			<dt>Mile</dt>
			<dd>White cold drink</dd>
		</dl>
	</body>
</html>
