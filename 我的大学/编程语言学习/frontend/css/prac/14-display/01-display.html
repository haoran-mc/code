<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .div1 {
            width: 100px;
            height: 100px;
            border: 1px solid red;
        }
        .span1 {
            width: 100px;
            height: 100px;
            border: 1px solid red;
        }
        .span2 {
            width: 100px;
            height: 100px;
            border: 1px solid red;
            display: block;
        }

        /*
        block 块元素
        inline 行内元素
        inline-block 是块元素，但是可以内联，在一行
        none 取消这个空间
        */
        .div2 {
            width: 100px;
            height: 100px;
            border: 1px solid red;
            display: inline-block;
        }
        .span3 {
            width: 100px;
            height: 100px;
            border: 1px solid red;
            display: inline-block;
        }
    </style>
</head>
<body>
<div class="div1">div块元素</div>
<span class="span1">span行内元素</span>
<span class="span2">span行内元素</span>
<br>
<hr>
<br>

<div class="div2">div元素变成行内块元素</div>
<span class="span3">span元素变为行内块元素</span>
</body>
</html>
