<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Title</title>
    <style>
        /*ul的第一个子元素*/
        ul li:first-child {
            background: red;
        }

        /*ul的最后一个子元素*/
        ul li:last-child {
            background: green;
        }

        /*
        选中p1: 定位到父元素，选择当前的第一个元素
        选中当前p元素的父级元素，选中父级元素的第一个元素，并且是当前元素才生效
        如果父级元素的第一个子元素不是p，那就不能定位，
        比如下面body下加入一个h1标签，那么就不能显示蓝色了，
        但是仍然能显示黄色
        */
        p:nth-child(1) {
            background: blue;
        }
        /*
        选中父元素下的第二个类型，类型是p
        nth-child是找父级元素下的第n个元素
        nth-of-type是找父级元素下的第n个p元素，不一样
        */
        p:nth-of-type(2) {
            background: yellow;
        }
        a:hover {
            background: black;
        }
    </style>
</head>
<body>
<p>p1</p>
<p>p2</p>
<p>p3</p>
<ul>
    <li>li1</li>
    <li>li2</li>
    <li>li3</li>
</ul>
<p>p7</p>
<p>p8</p>
<a href="https://www.baidu.com">鼠标放在这会变色</a>
</body>
</html>
