<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        h1, ul, li, a, body {
            /*body总有一个margin默认是8*/
            margin: 0;
            padding: 0;
            text-decoration: none;
        }

        #box {
            width: 300px;
            /*粗细，样式，颜色*/
            border: 1px solid red;
            /*外边距的妙用，居中元素*/
            /*要求：块元素有固定的宽度*/
            margin: 0 auto;
        }
        h2 {
            font-size: 16px;
            background-color: #3cbda6;
            line-height: 30px;
            margin: 0;
        }

        form {
            background: #3cbda6;
        }

        div:nth-of-type(1) input {
            border: 3px solid black;
        }

        div:nth-of-type(2) input {
            border: 3px dashed #4d0b8c;
        }

        div:nth-of-type(3) input {
            border: 2px dashed #008c27;
        }
    </style>
</head>
<body>
<div id="box">
    <h2>会员登录</h2>
    <form action="#">
        <div>
            <span>姓名：</span>
            <input type="text">
        </div>
        <div>
            <span>密码：</span>
            <input type="password">
        </div>
        <div>
            <span>邮箱：</span>
            <input type="text">
        </div>
    </form>
</div>
</body>
</html>
