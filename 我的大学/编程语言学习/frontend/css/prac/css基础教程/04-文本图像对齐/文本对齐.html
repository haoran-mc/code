<!DOCTYPE html>
<html>
	<head>
		<style>
			img.top {
				vertical-align: top;
			}

			img.middle {
				vertical-align: middle;
			}

			img.bottom {
				vertical-align: bottom;
			}
		</style>
	</head>
	<body>
		<p>
			一幅
			<img src="logo.png" alt="W3School" width="180" height="167" />
			默认对齐方式的图像。
		</p>
		<br />

		<p>
			一幅
			<img class="top" src="logo.png" alt="W3School" width="180" height="167" />
			上对齐的图像。
		</p>
		<br />

		<p>
			一幅
			<img class="middle" src="logo.png" alt="W3School" width="180" height="167" />
			居中对齐的图像。
		</p>
		<br />

		<p>
			一幅
			<img class="bottom" src="logo.png" alt="W3School" width="180" height="167" />
			下对齐的图像。
		</p>
	</body>
</html>
