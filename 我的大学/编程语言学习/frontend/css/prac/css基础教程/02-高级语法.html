<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Document</title>
	</head>
	<body>
		<h1>CSS高级语法</h1>
		<h2>选择器的分组</h2>
		<pre>
h1,h2,h3,h4,h5,h6 {
    color:green;
}
</pre
		>
		<h2>继承</h2>
		<p>
			根据以下规则，站点的body元素从父元素继承属性，子元素将继承最高级元素(此处是body)所拥有的属性
			子元素的子元素也是如此 少数浏览器不是(忽略)
		</p>
		<pre>
body {
    font-family: Verdana, sans-serlf;
}
        </pre
		>
	</body>
</html>
