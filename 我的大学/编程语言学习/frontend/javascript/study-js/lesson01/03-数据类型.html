<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script>
        /**
         * Number
         * 123      // 整数
         * 123.1    // 小数
         * 1.123e8  // 科学计数法
         * -99      // 负数
         * NaN      // 不是一个数
         * Infinity // 无穷大
         */

        /**
         * 字符串
         * 'abc'
         * "abc"
         */

        /**
         * 布尔值
         * true
         * false
         */

        /**
         * 逻辑运算
         * &&
         * ||
         * !
         */

        /**
         * 比较运算符
         * =
         * ==  等于    (类型不一样，值一样也会判断为true 1 == "1")
         * === 绝对等于 (类型一样，值一样，结果为true)
         * NaN与所有数值都不相等，包括自己
         * 只能通过isNaN(NaN)来判断这个数是否为NaN
         */
        console.log((1 / 3) === (1 - 2 / 3))   // 精度问题，这个为false
        console.log(Math.abs((1 / 3) - (1 - 2 / 3) < 0.0000001))

        /**
         * null 和 undefuned
         * null 定义了但为空
         * undefined 没有定义
         */

        /* 数组 */
        // Java中数组中数据类型要一样，Javascript中可以不一样
        // 为了保证代码可读性，所以使用这种方式就好
        var arr = [1, 2, 3, "hello"]

        new Array(1, 2, "hello")

        /**
         * 对象
         */
        // Person person = new Person(1, 2, 3)
        // 每个属性之间使用逗号隔开，最后一个不需要添加
        var person = {
            name: "ogmc",
            age: 20,
            tags: ['js', 'java', 'web']
        }
    </script>
</head>
